<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080D1A" />
    </linearGradient>
    <linearGradient id="cTopFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79AADB" />
      <stop offset="100%" stop-color="#427EBC" />
    </linearGradient>
    <linearGradient id="cLeftFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0062AD" />
      <stop offset="100%" stop-color="#00477D" />
    </linearGradient>
    <linearGradient id="cRightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00477D" />
      <stop offset="100%" stop-color="#002B4D" />
    </linearGradient>
    <filter id="cDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00599C" flood-opacity="0.4" />
    </filter>
    <filter id="cGlyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#001830" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#cBgGrad)" />
  <!-- Subtle border -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#00599C" stroke-width="3.5" stroke-opacity="0.4" />

  <!-- Hexagonal C Shield -->
  <g filter="url(#cDropShadow)">
    <!-- Hexagon bevel outline -->
    <polygon points="256,62 424,159 424,353 256,450 88,353 88,159" fill="none" stroke="#85B7EB" stroke-width="4" stroke-opacity="0.5" />

    <!-- Top Isometric Facet -->
    <polygon points="256,66 420,161 256,256 92,161" fill="url(#cTopFacet)" />

    <!-- Left Isometric Facet -->
    <polygon points="92,161 256,256 256,446 92,351" fill="url(#cLeftFacet)" />

    <!-- Right Isometric Facet -->
    <polygon points="256,256 420,161 420,351 256,446" fill="url(#cRightFacet)" />

    <!-- Inner facet seams -->
    <line x1="256" y1="66" x2="256" y2="256" stroke="#A5CDFA" stroke-width="2" stroke-opacity="0.4" />
    <line x1="92" y1="161" x2="256" y2="256" stroke="#A5CDFA" stroke-width="2" stroke-opacity="0.3" />
    <line x1="256" y1="256" x2="420" y2="161" stroke="#001F3B" stroke-width="2" stroke-opacity="0.4" />
    <line x1="256" y1="256" x2="256" y2="446" stroke="#001F3B" stroke-width="2" stroke-opacity="0.5" />
  </g>

  <!-- Centered Bold C Glyph -->
  <g filter="url(#cGlyphShadow)">
    <path
      d="M 334 186
         C 316 164 290 150 256 150
         C 198 150 152 196 152 256
         C 152 316 198 362 256 362
         C 290 362 316 348 334 326
         L 302 292
         C 290 306 274 314 256 314
         C 224 314 198 288 198 256
         C 198 224 224 198 256 198
         C 274 198 290 206 302 220
         Z"
      fill="#FFFFFF"
    />
  </g>
</svg>